apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// Baseline Profile: 由 :baselineprofile 的启动 ULP 生成, 自动嵌入 release 构建
apply plugin: 'androidx.baselineprofile'

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 37

    defaultConfig {
        applicationId 'com.kertou.tvplayer'
        minSdk 24
        targetSdk 34
        versionCode 39
        versionName '3.1.1'
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            outputFileName = 'TVBox_v' + variant.versionName + '_' + variant.buildType.name
            if (variant.buildType.name == buildTypes.release.getName()) {
                outputFileName += '_' + new Date().format("yyyyMMdd")
            }
            outputFileName += '.apk'
        }
    }

    packaging {
        exclude 'META-INF/DEPENDENCIES'
        //引入dlna-cast时的文件冲突
        exclude 'META-INF/beans.xml'
    }

    signingConfigs {
        config {
            def store = file('../kertou-tvplayer.jks')
            if (store.exists()) {
                keyAlias 'kertou'
                keyPassword 'uE=XdNG5UE5Q+^cGVep9v7gR'
                storeFile store
                storePassword 'uE=XdNG5UE5Q+^cGVep9v7gR'
            }
        }
    }

    buildTypes {
        debug {
            def store = file('../kertou-tvplayer.jks')
            if (store.exists()) {
                signingConfig signingConfigs.config
            }
        }

        release {
            def store = file('../kertou-tvplayer.jks')
            if (store.exists()) {
                signingConfig signingConfigs.config
            }
            minifyEnabled false
        }
    }

    baselineProfile {
        variants {
            release {
                // 启动 profile 由 :baselineprofile 的冷启动 ULP 收集生成
                from(project(':baselineprofile'))
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += 'META-INF/DEPENDENCIES'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar
    testImplementation libs.junit
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])

    implementation 'com.google.android.material:material:1.14.0'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation files('libs/commons-lang3-3.12.0.jar')
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation libs.bundles.okhttp
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'

    implementation project(":player")
    implementation project(":quickjs")
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'

    implementation 'com.lzy.net:okgo:3.0.4'
    // implementation 'com.tencent.bugly:crashreport_upgrade:latest.release'
    implementation 'com.owen:tv-recyclerview:3.0.0'

    implementation 'com.github.getActivity:XXPermissions:13.6'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'

    //沉浸式状态栏
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    //标题栏
    implementation 'com.github.getActivity:TitleBar:10.5'
    //弹窗
    implementation 'com.github.li-xiaojun:XPopup:2.10.0'
    //工具类
    implementation 'com.blankj:utilcodex:1.31.0'
    //阴影/shape/选择器/圆角/...
    implementation 'com.github.lihangleo2:ShadowLayout:3.3.3'
    //glide图片加载
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    //tab标题栏
    implementation project(":TabLayout")
    implementation project(':ViewPager1Delegate')
    //展开收缩tv
    implementation 'com.github.MZCretin:ExpandableTextView:v1.6.1-x'
    //lottie动画
    implementation 'com.airbnb.android:lottie:5.2.0'
    //流式布局
    implementation 'com.hyman:flowlayout-lib:1.1.2'
    //崩溃
    implementation project(":crash")
    //dlna投屏(jitpack原坐标已不可用,改为本地模块)
    implementation project(':dlna-dmc')
    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.2.0"
}
